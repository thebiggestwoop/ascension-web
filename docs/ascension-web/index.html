    <title>Ascension</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Undoes the site-root 404.html's redirect encoding (see docs/404.html), restoring the
      // real path into browser history *before* Vue Router reads the URL, so a hard refresh on
      // e.g. "/ascension-web/builder" lands back on "/ascension-web/builder" instead of
      // getting stuck on "/ascension-web/".
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
