<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ascension</title>
    <style>
      /* Renders immediately from the raw HTML, before the JS bundle (and Vuetify's CSS) has
         even finished downloading - masks the blank-page gap on a first/cold-cache visit.
         Vue's mount() replaces #app's contents wholesale, so this needs no manual removal. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fff;
        color: #1a1a1a;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      html.dark-loading #initial-loader {
        background: #121212;
        color: #eee;
      }
      #initial-loader .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      @keyframes initial-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="text/javascript">
      // Avoids a flash of the wrong theme behind the loading screen above - mirrors
      // theme.ts's own default (light unless the player has previously chosen dark).
      if (localStorage.getItem('ascension-theme') === 'dark') {
        document.documentElement.classList.add('dark-loading')
      }
    </script>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Undoes the site-root 404.html's redirect encoding (see docs/404.html), restoring the
      // real path into browser history *before* Vue Router reads the URL, so a hard refresh on
      // e.g. "/ascension-web/builder" lands back on "/ascension-web/builder" instead of
      // getting stuck on "/ascension-web/".
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <script type="module" crossorigin src="/ascension-web/assets/index-CCbWedzf.js"></script>
    <link rel="stylesheet" crossorigin href="/ascension-web/assets/index-CakakMe8.css">
  </head>
  <body>
    <div id="app">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div>Loading Ascension&hellip;</div>
      </div>
    </div>
  </body>
</html>
