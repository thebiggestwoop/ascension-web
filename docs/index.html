<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeroClub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #121212;
        color: #eee;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 2.5rem;
        margin: 0 0 1rem;
      }
      p {
        color: #aaa;
        margin: 0 0 2rem;
      }
      a.app-link {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        background: #6750a4;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a.app-link:hover {
        background: #7f67be;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HeroClub</h1>
      <p>A home for tabletop companion apps.</p>
      <a class="app-link" href="/ascension-web/">Open Ascension</a>

</html>
