    <script type="text/javascript">

      // Undoes 404.html's redirect encoding, restoring the real path into browser history
      // *before* Vue Router reads the URL, so a hard refresh on e.g. "/builder" lands back
      // on "/builder" instead of getting stuck on "/".
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
